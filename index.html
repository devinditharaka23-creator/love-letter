<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Letter ❤️</title>

    <style>
        body{
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#ff9ecf,#ffc7e8);
            font-family:Arial,sans-serif;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
        }

        h1{
            color:#ff4081;
        }

        button{
            padding:12px 25px;
            font-size:18px;
            border:none;
            border-radius:30px;
            background:#ff4081;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#e91e63;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>💌 Love Letter 💌</h1>
    <p>Hello My Love ❤️</p>

    <button onclick="showMessage()">
        Open Letter
    </button>
</div>

<script>
function showMessage(){
    alert("I Love You Forever ❤️🥰");
}
</script>

</body>
</html>
